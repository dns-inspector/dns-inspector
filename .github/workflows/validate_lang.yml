name: "Validate Localization"

on:
  push:
    paths:
      - '.github/workflows/validate_lang.yml'
      - 'dns-inspector/Localization/**'
  pull_request:
    paths:
      - 'dns-inspector/Localization/**'

permissions:
  packages: read

jobs:
  build:
    name: "Validate Localization"
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Source
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #pin v6.0.2
        with:
          persist-credentials: false

      - name: Validate localization
        id: validate_localization
        run: |
          cd dns-inspector/Localization
          python3 lang.py --validate
          if [[ $(git diff --stat) != '' ]]; then
            echo "::error ::Untracked changes to localization detected!"
            git status
            exit 1
          else
            echo "No untracked changes to localization detected"
          fi

      - name: Check Spelling
        id: spellcheck
        run: |
          cd .github/spellcheck
          npm ci
          node index.js ../../dns-inspector/Localization/Strings/en.strings
